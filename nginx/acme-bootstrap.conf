# Throwaway nginx used only by setup-env.sh to answer the Let's Encrypt
# http-01 challenge when first issuing a certificate.
#
# It exists because the deployed nginx (nginx/nginx.conf) proxies to the
# backend and frontend containers, and nginx resolves upstream hostnames at
# startup -- so it cannot run before the app stack does. Issuing a certificate
# should not require the whole application to boot first.
#
# Renewals do NOT use this file: by then the deployed nginx is running and
# serves the same webroot from its own /.well-known/acme-challenge/ location.

events {}

http {
  access_log /dev/stdout;
  error_log  /dev/stderr;

  server {
    listen 80;
    server_name _;

    # certbot --webroot writes tokens to nginx/acme-challenge on the host,
    # bind-mounted here at /var/www/acme.
    location /.well-known/acme-challenge/ {
      root /var/www/acme;
    }

    location / {
      return 404;
    }
  }
}
