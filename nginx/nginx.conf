events {}

http {
  limit_req_zone $binary_remote_addr zone=global:10m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conns:10m;
  limit_req_status 429;
  limit_conn_status 429;

  server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

	# Rate limiting
	limit_req zone=global burst=150 nodelay;
	limit_conn conns 30;

    # Allow multipart overhead; the backend enforces a 5 MB avatar file limit.
    client_max_body_size 6m;

    # API + WebSocket requests are proxied to the backend.
    # Trailing slash strips the "/api/" prefix: /api/auth/login -> /auth/login,
    # since the backend mounts its routers at /auth, /users, /game (no /api).
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://backend:3000/;

      proxy_http_version 1.1;

      # Required for WebSocket connections
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
	  proxy_read_timeout 3600s;
    }

    # Keep avatars stored before the API-prefixed URL migration accessible.
    location /uploads/ {
      limit_req zone=global burst=150 nodelay;
      proxy_pass http://backend:3000/uploads/;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is served by the Next.js frontend
    location / {
      proxy_pass http://frontend:3000;

      proxy_http_version 1.1;

      # Required for Next.js hot-reload WebSocket (dev mode)
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

	location /_next/static/ {
      limit_req zone=global burst=1000 nodelay;
	  limit_conn conns 50;
      proxy_pass http://frontend:3000;
	}
  }
}
