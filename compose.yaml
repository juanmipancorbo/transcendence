services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: "./database/container/.env"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ft_transcendence -U ${POSTGRES_USER:-ft_trans42}"]
      interval: 300s
      timeout: 30s
      retries: 5
      start_period: 3s
  backend:
    build:
      context: ./backend
      dockerfile: ./container/Dockerfile
      target: production
    restart: unless-stopped
    expose:
      - "3000"
    env_file: "./backend/container/.env"
    volumes:
      #Put this on development
      # - ./backend/app:/app
      - avatar_uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 300s
      timeout: 30s
      retries: 5
      start_period: 3s

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
      target: production
    restart: unless-stopped
    expose:
      - "3000"
    env_file: "./frontend/.env"
    #Put this on development
    # volumes:
    #   - ./frontend:/app
    #   - frontend_node_modules:/app/node_modules
    # environment:
    #   - NODE_ENV=development
    #   - WATCHPACK_POLLING=true
    depends_on:
      backend:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - frontend
volumes:
  postgres_data:
  frontend_node_modules:
  avatar_uploads:
