<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" role="img" aria-label="Reversiverse">
  <title>Reversiverse</title>
  <!-- Square mustard tile with a dark pixel-art frame. -->
  <rect width="64" height="64" fill="#d5a62b"/>
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#211e1b" stroke-width="4"/>
  <!-- Reversi stone: one light face and one dark face. -->
  <path fill="#f4e7c5" d="M32 14a18 18 0 0 0 0 36z"/>
  <path fill="#211e1b" d="M32 14a18 18 0 0 1 0 36z"/>
  <!-- The outline and center seam use the same stroke width. -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#211e1b" stroke-width="3"/>
  <rect x="30.5" y="14" width="3" height="36" fill="#211e1b"/>
</svg>
